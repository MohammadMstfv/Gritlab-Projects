<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ASCII Art Web</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
    <header>
        <div>
            <p class="eyebrow">Ghazal & Mohammad, Go projects</p>
            <h2>ASCII Art Generator</h2>
        </div>
        <div class="header-mark" aria-hidden="true"></div>
    </header>
    <form id="ascii-form" class="workspace" action="/ascii-art" method="post">
        <section class="panel input-panel" aria-labelledby="input-heading">
            <div class="panel-heading">
                <h2 id="input-heading">Input</h2>
                <span class="status" id="character-count">0 characters</span>
            </div>
            <div class="form-fields">
                <div>
                    <label for="text">Your text</label>
                    <textarea id="text" name="text" placeholder="Type something..." autofocus required></textarea>
                </div>
                <div>
                    <label for="banner">Style</label>
                    <select id="banner" name="banner">
                        <option value="standard">Standard</option>
                        <option value="shadow">Shadow</option>
                        <option value="thinkertoy">Thinkertoy</option>
                        <option value="Binary">Binary</option>
                    </select>
                </div>
            </div>
        </section>
        <section class="panel preview" aria-labelledby="preview-heading">
            <div class="panel-heading">
                <h2 id="preview-heading">Live preview</h2>
                <span class="status" id="render-status" aria-live="polite">Waiting for text</span>
            </div>
            <pre id="live-result" class="live-output is-empty" aria-live="polite">Preview updates as you type.</pre>
            <div class="preview-actions">
                <button id="generate-button" type="button">Generate</button>
                <button id="new-page-button" type="submit" formtarget="_blank">See in another page</button>
            </div>
        </section>
    </form>
    <section class="panel result-panel" aria-labelledby="result-heading">
        <div class="panel-heading">
            <h2 id="result-heading">Result</h2>
            <span class="status" id="result-status" aria-live="polite">Waiting for Generate</span>
        </div>
        <pre id="result" class="result-output is-empty" aria-live="polite">Your generated ASCII art will appear here.</pre>
        <div class="actions">
                <button id="copy-button" type="button" disabled>Copy output</button>
                <button id="save-button" type="button" disabled>Save as image</button>
        </div>
    </section>
</main>
<script src="/static/script.js?v=8" defer></script>
</body>
</html>
